<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telekom Tinker Tech Support</title>
  <link rel="stylesheet" href="web.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Rubik+Mono+One&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- decorative spinning tinker discs -->
  <div class="spinner spinner--one" aria-hidden="true">
    <img src="img/OIP-2716065024.jpg" alt="" />
  </div>
  <div class="spinner spinner--two" aria-hidden="true">
    <img src="img/OIP-1056120868.jpg" alt="" />
  </div>
  <div class="spinner spinner--three" aria-hidden="true">
    <img src="img/OIP-194925064.jpg" alt="" />
  </div>

  <main class="card">
    <figure class="hero">
      <img
        src="img/OIP-1699899566.jpg"
        alt="Tinker-Pferd mit voller heller Mähne und Behang im Abendlicht"
        loading="eager"
      />
    </figure>

    <header class="card__head">
      <div class="badge">
        <span class="badge__dot"></span>
        Stall geöffnet
      </div>
      <h1 class="title">
        <span class="title__telekom">Telekom</span>
        <span class="title__tinker">Tinker</span>
        <span class="title__rest">Tech&nbsp;Support</span>
      </h1>
      <p class="tagline">
        &#128246; Netzwerk-Sprechstunde &middot; Bandbreite auf Trab gebracht &middot; Termin gesattelt
      </p>
    </header>

    <form id="termin-form" class="form" novalidate>
      <label class="field">
        <span class="field__label">Dein Name</span>
        <input
          type="text"
          id="name"
          name="name"
          class="field__input"
          placeholder="z.&nbsp;B. Ada Tinkerbell"
          autocomplete="name"
          required
        />
      </label>

      <label class="field">
        <span class="field__label">Wunschtermin (in der Zukunft)</span>
        <input type="date" id="datum" name="datum" class="field__input" required />
      </label>

      <p id="fehler" class="error" role="alert" hidden></p>

      <button type="submit" class="btn" id="submit-btn">
        <span class="btn__cog" aria-hidden="true">
          <img src="img/OIP-1382626524.jpg" alt="" />
        </span>
        <span id="btn-text">Termin an den Stall schicken</span>
      </button>

      <p class="hint">
        &#128231; Der Terminwunsch wird direkt via E-Mail versendet.
      </p>
    </form>

    <div id="erfolg" class="success" hidden>
      <div class="success__horse" aria-hidden="true">&#128014;</div>
      <p id="erfolg-text"></p>
    </div>
  </main>

  <section class="gallery" aria-label="Tinker-Galerie">
    <h2 class="gallery__title">&#128014; Unsere Tinker</h2>
    <div class="gallery__grid">
      <figure>
        <img src="img/OIP-1056120868.jpg" alt="Tinker-Stute mit Fohlen auf einer Blumenwiese" loading="lazy" />
        <figcaption>Stute mit Fohlen</figcaption>
      </figure>
      <figure>
        <img src="img/OIP-1382626524.jpg" alt="Tinker-Pferd im gestreckten Galopp &uuml;ber eine Wiese" loading="lazy" />
        <figcaption>Voller Galopp</figcaption>
      </figure>
      <figure>
        <img src="img/OIP-194925064.jpg" alt="Schwarz-wei&szlig;er Tinker im schwungvollen Trab" loading="lazy" />
        <figcaption>Schwungvoller Trab</figcaption>
      </figure>
      <figure>
        <img src="img/OIP-2716065024.jpg" alt="Tinker-Pferd steht ruhig vor einem Gartenbeet" loading="lazy" />
        <figcaption>Barocke Ruhe</figcaption>
      </figure>
    </div>
  </section>

  <footer class="page-foot">
    Kein Server, nur Pferdest&auml;rken &mdash; alles l&auml;uft in deinem Browser. &#128014;
  </footer>

  <div id="erfolg-modal" class="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" class="modal__x" data-close aria-label="Schlie&szlig;en">&times;</button>
      <img
        class="modal__img"
        src="img/erfolg.jpg"
        alt="Tinker-Pferd mit Partyhut, Konfetti und &bdquo;Happy Tinker&ldquo;-Girlande"
      />
      <div class="modal__body">
        <h2 id="modal-title">Termin steht! &#127881;</h2>
        <p id="modal-text"></p>
        <button type="button" class="btn" data-close>Wieherlich &ndash; danke!</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // ---- URL deines Cloudflare Workers (nach dem Deploy eintragen) ----
      var WORKER_URL = "https://tinker-tech-support-mailer.josua-lampas.workers.dev";

      var form = document.getElementById("termin-form");
      var nameInput = document.getElementById("name");
      var datumInput = document.getElementById("datum");
      var fehler = document.getElementById("fehler");
      var erfolg = document.getElementById("erfolg");
      var erfolgText = document.getElementById("erfolg-text");
      var nochmal = document.getElementById("nochmal");
      var submitBtn = document.getElementById("submit-btn");
      var btnText = document.getElementById("btn-text");
      var modal = document.getElementById("erfolg-modal");
      var modalText = document.getElementById("modal-text");

      // Minimaldatum = morgen
      var morgen = new Date();
      morgen.setDate(morgen.getDate() + 1);
      var minStr = morgen.toISOString().split("T")[0];
      datumInput.min = minStr;

      function zeigeFehler(text) {
        fehler.textContent = text;
        fehler.hidden = false;
      }

      function versteckeFehler() {
        fehler.hidden = true;
      }

      function formatiereDatum(iso) {
        var teile = iso.split("-");
        var d = new Date(Number(teile[0]), Number(teile[1]) - 1, Number(teile[2]));
        return d.toLocaleDateString("de-DE", {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric"
        });
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        versteckeFehler();

        var name = nameInput.value.trim();
        var datum = datumInput.value;

        if (!name) {
          zeigeFehler("Bitte trag deinen Namen ein, sonst weiß der Stallmeister nicht, wen er satteln soll.");
          nameInput.focus();
          return;
        }

        if (!datum) {
          zeigeFehler("Bitte wähle ein Datum für deinen Termin.");
          datumInput.focus();
          return;
        }

        var gewaehlt = new Date(datum + "T00:00:00");
        var heute = new Date();
        heute.setHours(0, 0, 0, 0);

        if (gewaehlt <= heute) {
          zeigeFehler("Der Termin muss in der Zukunft liegen – Zeitmaschine ist noch in Reparatur.");
          datumInput.focus();
          return;
        }

        var lesbar = formatiereDatum(datum);

        setLaedt(true);

        fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: name, date: datum })
        })
          .then(function (res) {
            return res.json().catch(function () { return {}; }).then(function (body) {
              return { ok: res.ok, body: body };
            });
          })
          .then(function (result) {
            if (!result.ok) {
              throw new Error(
                (result.body && result.body.error) ||
                  "Der Server hat die Nachricht abgelehnt."
              );
            }
            var meldung =
              name + ", dein Terminwunsch für " + lesbar +
              " ist im Stall eingegangen. Wieher melden uns, satteln auf und geloppieren los!";
            erfolgText.textContent = meldung;
            modalText.textContent = meldung;
            form.hidden = true;
            erfolg.hidden = false;
            oeffneModal();
          })
          .catch(function (err) {
            zeigeFehler(
              (err && err.message ? err.message : "Verbindung zum Stall fehlgeschlagen.") +
              " Bitte später nochmal versuchen."
            );
          })
          .then(function () {
            setLaedt(false);
          });
      });

      function setLaedt(an) {
        submitBtn.disabled = an;
        btnText.textContent = an ? "Tinker galoppieren los …" : "Termin an den Stall schicken";
      }

      function oeffneModal() {
        modal.hidden = false;
        document.body.style.overflow = "hidden";
        var okBtn = modal.querySelector(".modal__body .btn");
        if (okBtn) okBtn.focus();
      }

      function schliesseModal() {
        modal.hidden = true;
        document.body.style.overflow = "";
      }

      modal.addEventListener("click", function (e) {
        if (e.target.hasAttribute("data-close")) schliesseModal();
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && !modal.hidden) schliesseModal();
      });

      nochmal.addEventListener("click", function () {
        form.reset();
        datumInput.min = minStr;
        erfolg.hidden = true;
        form.hidden = false;
        nameInput.focus();
      });
    })();
  </script>
</body>
</html>
